trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

steps:
  - task: UseNode@1
    inputs:
      version: '26.8.2'
    displayName: Install Node.js

  - script: npm ci
    displayName: Install locked dependencies

  - script: npm test
    displayName: Run unit and contract tests
    env:
      GATEPASS_SHARP_PATH: $(Build.SourcesDirectory)/node_modules/sharp

# Live SQL integration is run separately against an isolated SQL Server test
# database. This pipeline neither deploys the application nor accesses live data.
