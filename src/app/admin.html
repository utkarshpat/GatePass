<dialog class="app-dialog lead-dialog" id="lead-dialog" aria-labelledby="lead-title"><div class="dialog-heading"><div><h2 id="lead-title">Project Leads</h2><p id="lead-project" class="hint"></p></div><button type="button" id="close-leads" class="quiet" aria-label="Close project leads">✕</button></div><div class="dialog-body"><p id="lead-status" role="status" aria-live="polite"></p><div id="lead-list"></div><button type="button" class="secondary" id="more-leads" hidden>Load more leads</button><form id="lead-form" hidden><h3>Assign New Project Lead</h3><div class="field"><label for="employee-search">Search Employee</label><input id="employee-search" type="search" maxlength="80" autocomplete="off" placeholder="Search name, email or employee ID"><p id="search-status" class="hint" role="status" aria-live="polite"></p><div id="employee-results" class="employee-results" role="group" aria-label="Matching employees"></div><div id="selected-employee" hidden></div></div><div class="field"><label for="lead-scope">Access Scope</label><select id="lead-scope"></select></div><div class="field"><label for="grant-reason">Assignment Reason</label><input id="grant-reason" maxlength="300" placeholder="e.g. Project Delivery Lead delegation" required></div><button type="submit" class="primary" id="add-lead" disabled>Assign Lead</button></form><form id="remove-form" hidden><h3 id="remove-title">Remove Project Lead</h3><div class="field"><label for="remove-reason">Revocation Reason</label><input id="remove-reason" maxlength="300" placeholder="e.g. Project transition / roll-off" required></div><div class="admin-toolbar"><button type="button" class="secondary" id="cancel-remove">Cancel</button><button type="submit" class="primary" id="remove-lead">Confirm Removal</button></div></form></div></dialog>
