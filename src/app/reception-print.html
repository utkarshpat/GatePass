<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print pass</title><style nonce="__NONCE__">@page{size:85.6mm 54mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;font-family:Arial,sans-serif}main{max-width:856px;margin:32px auto;padding:16px}img{display:block;width:100%;height:auto}p{color:#192132}button{min-height:44px;padding:8px 20px;background:#c90035;color:white;border:0;border-radius:8px;cursor:pointer}@media print{body{background:white}main{width:85.6mm;height:54mm;max-width:none;margin:0;padding:0}img{width:85.6mm;height:54mm}p,button{display:none}}</style></head><body><main><p id="status" role="status">Preparing pass…</p><img id="pass" alt="Pass card" hidden><button id="print" type="button" hidden>Print</button></main><script nonce="__NONCE__">'use strict';let consumed=false;const receiver=opener||(parent!==window?parent:null);window.addEventListener('message',async event=>{if(event.origin!==location.origin||event.source!==receiver||consumed)return;const input=event.data;if(input?.type==='gatepass-print-error'){document.getElementById('status').textContent=input.message;return;}if(input?.type!=='gatepass-print-image'||typeof input.printJobId!=='string'||! /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(input.printJobId)||!['image/svg+xml','image/png'].includes(input.mimeType)||typeof input.imageBase64!=='string'||input.imageBase64.length>14680064)return;consumed=true;const image=document.getElementById('pass');image.src='data:'+input.mimeType+';base64,'+input.imageBase64;try{await image.decode();image.hidden=false;document.getElementById('status').textContent='Check the printer, card size and orientation.';document.getElementById('print').hidden=false;receiver.postMessage({type:'gatepass-print-loaded',printJobId:input.printJobId},location.origin);window.focus();}catch{receiver.postMessage({type:'gatepass-print-display-error',printJobId:input.printJobId},location.origin);document.getElementById('status').textContent='Pass could not be displayed. Close this window and retry.'}});document.getElementById('print').addEventListener('click',()=>{document.getElementById('print').disabled=true;document.getElementById('status').textContent='Print dialog opened. Close this window when finished.';window.print();});if(receiver)receiver.postMessage({type:'gatepass-print-ready'},location.origin);</script></body></html>
