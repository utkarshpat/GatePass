<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GatePass</title><style nonce="__NONCE__">__GLOBAL_STYLES__
@layer layouts { .email-header{display:flex;align-items:center;min-height:5rem;padding:1rem 1.5rem;border-bottom:1px solid var(--gp-border)} .email-main{width:100%;max-width:38rem;margin:0 auto;padding:clamp(1.25rem,5vw,2.5rem)} .email-fields{display:grid;grid-template-columns:minmax(5rem,1fr) 2fr;gap:.75rem 1rem;margin:1.5rem 0} .email-fields dt{color:var(--gp-text-muted)} .email-fields dd{margin:0;overflow-wrap:anywhere} .email-actions{display:flex;gap:.75rem;margin:1.5rem 0;flex-wrap:wrap} .email-photo{width:6rem;height:7.5rem;object-fit:cover;border-radius:var(--gp-radius-control)} .email-card{display:block;width:100%;height:auto;margin-top:1.5rem} .email-field{display:grid;gap:.5rem;margin:1rem 0} .email-status{margin:1rem 0;color:var(--gp-text-muted)} .email-login{margin-top:2rem} }
</style></head><body><header class="email-header"><img width="180" src="data:image/png;base64,__COMPANY_LOGO__" alt="Sopra Steria"></header><main class="email-main"><h1 id="title">Request</h1><p id="message" class="email-status" role="status" aria-live="polite">Loading…</p>
<form id="login" class="email-login" hidden><div class="email-field"><label for="email">Sopra Steria email</label><input id="email" type="email" autocomplete="username" maxlength="320" required></div><div class="email-field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required></div><button class="primary" id="sign-in">Sign in</button></form>
<section id="request" hidden aria-label="Request details"><img id="photo" class="email-photo" alt="Request holder" hidden><dl id="fields" class="email-fields"></dl><div id="actions" class="email-actions" hidden><button class="primary" id="approve" type="button">Approve</button><button class="secondary" id="reject" type="button">Reject</button></div><button class="primary" id="download" type="button" hidden>Download pass</button><img id="card" class="email-card" alt="Digital pass" hidden></section></main><script nonce="__NONCE__">__EMAIL_SCRIPT__</script></body></html>
