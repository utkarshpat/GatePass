<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Reception Desk · Sopra Steria GatePass</title><style nonce="__NONCE__">__STYLES__</style></head><body>
<a class="skip" href="#workspace">Skip to content</a>
<header class="reception-header"><div class="header-brand"><img src="data:image/png;base64,__COMPANY_LOGO__" width="192" alt="Sopra Steria"><span class="portal-tag">Reception Desk</span></div><div id="staff-session" class="staff-user-menu" hidden><div class="user-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span id="staff-name"></span><button type="button" class="quiet logout-icon-btn" id="staff-logout" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button></div></header>
<main id="workspace" class="reception-workspace" tabindex="-1">
<p id="staff-loading" role="status" class="loading-state" hidden><span class="spinner" aria-hidden="true"></span>Loading reception…</p>
<section id="reception-dashboard" hidden>
<div class="reception-title"><div><h1>Reception</h1><p id="office-name" class="office-subtitle"></p></div><div class="reception-date-controls"><div class="reception-date"><label class="sr-only" for="reception-date">Visit date</label><input id="reception-date" type="date"><button id="today" class="secondary btn-today" type="button">Today</button><button id="refresh" class="secondary icon-action" type="button" aria-label="Refresh visits" title="Refresh visits"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button></div><div id="office-selector" hidden><label class="sr-only" for="reception-location">Office</label><select id="reception-location"></select></div></div></div>

<div class="stats-grid" id="reception-stats" aria-label="Summary Metrics">
  <div class="stat-card stat-primary"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="stat-content"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Matching visits</span></div></div>
  <div class="stat-card stat-warning"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-content"><span class="stat-value" id="stat-pending">0</span><span class="stat-label">Pending Approval</span></div></div>
  <div class="stat-card stat-info"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="stat-content"><span class="stat-value" id="stat-inside">0</span><span class="stat-label">Currently Inside</span></div></div>
  <div class="stat-card stat-success"><div class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div><div class="stat-content"><span class="stat-value" id="stat-printed">0</span><span class="stat-label">Print handoffs</span></div></div>
</div>

<div class="reception-filters-row">
  <div class="status-filters" role="group" aria-label="Filter visits by status">
    <button type="button" data-status="ALL" aria-pressed="true">All</button>
    <button type="button" data-status="PENDING" aria-pressed="false">Pending</button>
    <button type="button" data-status="APPROVED" aria-pressed="false">Approved</button>
    <button type="button" data-status="DENIED" aria-pressed="false">Denied</button>
    <button type="button" data-status="CANCELLED" aria-pressed="false">Cancelled</button>
  </div>
  <div class="reception-search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <label class="sr-only" for="visit-search">Search name, employee ID or pass ID</label>
    <input id="visit-search" type="search" maxlength="100" placeholder="Search name, pass ID or employee..." autocomplete="off">
  </div>
</div>

<div id="list-status" class="list-status" role="status" aria-live="polite"></div>
<div class="visits-table-wrap" tabindex="0" role="region" aria-label="Visits Table">
  <table class="visits-table">
    <thead>
      <tr>
        <th scope="col">Visitor / Person</th>
        <th scope="col">Project Destination</th>
        <th scope="col">Status</th>
        <th scope="col">Valid Until</th>
        <th scope="col" class="th-actions"><span class="sr-only">Actions</span></th>
      </tr>
    </thead>
    <tbody id="visit-rows"></tbody>
  </table>
</div>
<div id="empty-visits" class="reception-empty" hidden>
  <div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
  <h2>No visits found</h2>
  <p class="hint">No requests match the selected date or search filter.</p>
</div>
<div class="list-actions"><button class="secondary" id="load-more" type="button" hidden>Load more</button></div>
</section></main>

<dialog id="visit-dialog" class="app-dialog reception-detail" aria-labelledby="visit-title">
  <div class="dialog-heading"><h2 id="visit-title">Visit details</h2><button id="close-visit" type="button" class="quiet" aria-label="Close visit details">✕</button></div>
  <div class="dialog-body" tabindex="0" role="region" aria-label="Visit information and card preview">
    <div id="detail-status" role="status"></div>
    <div class="reception-person">
      <img id="detail-photo" width="80" height="100" alt="Person photo" hidden>
      <div class="reception-person-info">
        <h3 id="detail-name"></h3>
        <p id="detail-kind" class="detail-kind-tag"></p>
        <div id="detail-badge"></div>
      </div>
    </div>
    <dl id="detail-fields" class="reception-fields"></dl>
    <div id="card-status" class="card-status-message" role="status"></div>
    <div id="reception-card" class="reception-card" hidden></div>
  </div>
  <div class="dialog-actions">
    <button id="retry-detail" class="secondary" type="button" hidden>Retry</button>
    <button id="detail-print" class="primary btn-print" type="button" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Print Pass</button>
  </div>
</dialog>
<script nonce="__NONCE__">__SCRIPT__</script></body></html>
